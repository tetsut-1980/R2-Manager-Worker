name = "r2-manager-worker"
compatibility_date = "2024-04-03"
main = "dist/assets/index-CvVFNVJC.js" # 👈 前回のログで成功していた確定ファイル名です

[[d1_databases]]
binding = "METADATA"
database_name = "r2-manager-metadata"
database_id = "r2-manager-metadata"

[[r2_buckets]]
binding = "R2"
bucket_name = "r2-bucket" # 👈 もし実際のバケット名が違う場合は、ここをご自身のバケット名に書き換えてください
