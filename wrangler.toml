name = "r2-manager-worker"
compatibility_date = "2024-04-03"
workers_dev = true

[[d1_databases]]
binding = "METADATA"
database_name = "【あなたの実際のD1データベース名】"  # 👈 ここを書き換える
database_id = "【あなたのD1のUUID（※分かればでOK、不明なら行ごと消しても可）】"

[[r2_buckets]]
binding = "R2"
bucket_name = "【あなたの実際のR2バケット名】"      # 👈 ここを書き換える（例: my-photo-bucket）

[[unsafe.bindings]]
name = "RATE_LIMITER_READ"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_WRITE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 200, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_DELETE"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[assets]
directory = "./dist"
